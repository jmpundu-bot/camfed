<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CAMFED Attendance Registration</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="purple-page">
<div class="container">
  <div class="card">
    <img src="/images/camfed-logo.png" class="logo" alt="CAMFED logo" onerror="this.style.display='none'">
    <div class="brand-slogan"><span>Learn, Thrive &amp; Lead for Change</span></div>
    <h1>CAMFED Attendance Registration</h1>
    <div id="eventInfo" class="event-box">Loading event information...</div>
    <form id="attendanceForm">
      <label>1. Full Name<input id="fullName" required></label>
      <label>2. Email Address<input id="emailAddress" type="email" autocomplete="email" required></label>
      <label>3. Gender<select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></label>
      <label>4. Designation<input id="designation" required></label>
      <label>5. Organisation<input id="organisation" required></label>
      <label>6. Mobile Money Number<input id="phoneNumber" type="tel" inputmode="numeric" placeholder="0971234567" required></label>
      <label>7. NRC Number<input id="nrcNumber" placeholder="123456/12/1" required></label>
      <label>8. District<input id="district" required></label>
      <label>9. Mobile Registered Name<input id="mobileRegisteredName" required></label>
      <div class="photo-section">
        <label>9. Live Photo</label>
        <p>A clear, well-lit live photo showing one face is required for this registration.</p>
        <video id="photoVideo" autoplay playsinline muted hidden></video>
        <canvas id="photoCanvas" hidden></canvas>
        <img id="photoPreview" alt="Live photo preview" hidden>
        <div class="photo-actions">
          <button type="button" id="startCamera" class="secondary">Open Camera</button>
          <button type="button" id="capturePhoto" hidden>Capture Photo</button>
          <button type="button" id="retakePhoto" class="secondary" hidden>Retake Photo</button>
        </div>
        <p id="photoStatus" aria-live="polite">A live photo is required before registration.</p>
      </div>
      <div class="event-box"><strong></strong><p></p><p id="gpsStatus" aria-live="polite"></p></div>
      <div class="signature-section"><label>11. Signature</label><canvas id="signaturePad" width="900" height="300"></canvas><button type="button" id="clearSignature" class="secondary">Clear Signature</button></div>
      <button id="submitBtn" type="submit">Submit Registration</button>
      <p id="message" class="message"></p>
    </form>
  </div>
</div>
<script>
const form=document.getElementById('attendanceForm'), canvas=document.getElementById('signaturePad'), ctx=canvas.getContext('2d');
const message=document.getElementById('message'), submitBtn=document.getElementById('submitBtn');
let drawing=false, gpsLocation=null, livePhoto=null, photoVerified=false, cameraStream=null, pathParts=location.pathname.split('/').filter(Boolean), eventSlug=pathParts[0]==='register' ? (pathParts[1] || '') : '';
const photoVideo=document.getElementById('photoVideo'), photoCanvas=document.getElementById('photoCanvas'), photoPreview=document.getElementById('photoPreview'), photoStatus=document.getElementById('photoStatus');
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}photoVideo.srcObject=null;}
document.getElementById('startCamera').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera access requires HTTPS or localhost and a supported browser.');stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});photoVideo.srcObject=cameraStream;photoVideo.hidden=false;photoPreview.hidden=true;document.getElementById('capturePhoto').hidden=false;document.getElementById('retakePhoto').hidden=true;photoStatus.textContent='Camera is ready. Position your face and capture the photo.';}catch(err){photoStatus.textContent='Could not open camera: '+err.message;}};
async function validateLivePhoto(){
  if(typeof window.FaceDetector!=='function')throw new Error('This browser cannot verify faces in photos. Please use a supported, up-to-date browser.');
  const detector=new FaceDetector({fastMode:false,maxDetectedFaces:2}), faces=await detector.detect(photoCanvas);
  if(faces.length!==1)throw new Error(faces.length?'Please ensure only the attendee is in the photo.':'No face was detected. Retake the photo with the attendee facing the camera.');
  const face=faces[0].boundingBox;
  if(face.width<photoCanvas.width*.12||face.height<photoCanvas.height*.12)throw new Error('The face is too small. Move closer and retake the photo.');
  const {data}=photoCanvas.getContext('2d').getImageData(0,0,photoCanvas.width,photoCanvas.height);let sum=0,squares=0,edges=0,count=0;
  for(let y=0;y<photoCanvas.height;y+=4)for(let x=0;x<photoCanvas.width;x+=4){const i=(y*photoCanvas.width+x)*4;const l=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];sum+=l;squares+=l*l;if(x>=4){const j=i-4*4,prev=.2126*data[j]+.7152*data[j+1]+.0722*data[j+2];edges+=(l-prev)**2;}count++;}
  const mean=sum/count, variance=squares/count-mean*mean, sharpness=edges/count;
  if(mean<45||mean>220)throw new Error('The photo is too dark or overexposed. Improve the lighting and retake it.');
  if(variance<180||sharpness<18)throw new Error('The photo is unclear or out of focus. Hold the camera steady and retake it.');
  return true;
}
document.getElementById('capturePhoto').onclick=async()=>{if(!cameraStream||!photoVideo.videoWidth){photoStatus.textContent='Camera is not ready yet. Please wait and try again.';return;}const maxW=900, scale=Math.min(1,maxW/photoVideo.videoWidth);photoCanvas.width=Math.round(photoVideo.videoWidth*scale);photoCanvas.height=Math.round(photoVideo.videoHeight*scale);photoCanvas.getContext('2d').drawImage(photoVideo,0,0,photoCanvas.width,photoCanvas.height);stopCamera();document.getElementById('capturePhoto').disabled=true;photoStatus.textContent='Checking face, lighting and clarity…';try{await validateLivePhoto();livePhoto=photoCanvas.toDataURL('image/jpeg',0.82);photoVerified=true;photoPreview.src=livePhoto;photoPreview.hidden=false;photoVideo.hidden=true;document.getElementById('capturePhoto').hidden=true;document.getElementById('retakePhoto').hidden=false;photoStatus.textContent='Photo verified. One clear, well-lit face was detected.';}catch(err){livePhoto=null;photoVerified=false;photoStatus.textContent=err.message;photoVideo.hidden=true;document.getElementById('startCamera').textContent='Retake Photo';document.getElementById('startCamera').hidden=false;}finally{document.getElementById('capturePhoto').disabled=false;}};
document.getElementById('retakePhoto').onclick=()=>{livePhoto=null;photoVerified=false;photoPreview.hidden=true;document.getElementById('retakePhoto').hidden=true;document.getElementById('startCamera').click();};
function getGpsLocation(){const status=document.getElementById('gpsStatus');if(!('geolocation' in navigator)){status.textContent='GPS is unavailable in this browser. Registration cannot proceed without location.';return Promise.resolve(null);}status.textContent='Requesting location permission…';return new Promise(resolve=>navigator.geolocation.getCurrentPosition(pos=>{gpsLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,locationCapturedAt:new Date(pos.timestamp).toISOString()};status.textContent=`Location captured (accuracy about ${Math.round(pos.coords.accuracy)} metres).`;resolve(gpsLocation);},err=>{gpsLocation=null;status.textContent=err.code===1?'Location permission denied. Please allow location access to register.':'Could not get your location. Check GPS/location settings and try again.';resolve(null);},{enableHighAccuracy:true,timeout:10000,maximumAge:0}));}
function setupCanvas(){ const r=canvas.getBoundingClientRect(), d=window.devicePixelRatio||1; canvas.width=r.width*d; canvas.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth=2; ctx.lineCap='round'; }
setupCanvas(); window.addEventListener('resize',setupCanvas);
function point(e){const r=canvas.getBoundingClientRect(); const t=e.touches?.[0]||e; return {x:t.clientX-r.left,y:t.clientY-r.top};}
function start(e){drawing=true; const p=point(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();}
function move(e){if(!drawing)return; const p=point(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault();}
function end(){drawing=false;}
canvas.addEventListener('pointerdown',start); canvas.addEventListener('pointermove',move); canvas.addEventListener('pointerup',end); canvas.addEventListener('pointerleave',end);
document.getElementById('clearSignature').onclick=()=>{ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);};
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadEvent(){try{const url=eventSlug?`/api/event/${encodeURIComponent(eventSlug)}`:'/api/event'; const r=await fetch(url); const e=await r.json(); if(!r.ok)throw new Error(e.error); eventSlug=e.slug; document.getElementById('eventInfo').innerHTML=`<strong>${escapeHtml(e.name)}</strong><br>Date: ${escapeHtml(e.date)}<br>Venue: ${escapeHtml(e.venue)}`; if(e.expired){closeRegistration('Registration for this event has expired. Please contact the event administrator.');}}catch(err){document.getElementById('eventInfo').textContent=err.message;}}
function closeRegistration(reason){Array.from(form.elements).forEach(el=>el.disabled=true);submitBtn.disabled=true;submitBtn.textContent='Registration Closed';message.className='message error';message.textContent=reason;}
loadEvent();
form.addEventListener('submit',async e=>{e.preventDefault(); message.textContent=''; if(!form.reportValidity())return; const signature=canvas.toDataURL('image/png');
 if(signature.length<500) {message.className='message error'; message.textContent='Please provide your signature.'; return;}
 if(!livePhoto||!photoVerified){message.className='message error';message.textContent='Please capture and verify a clear, well-lit photo showing the attendee’s face.';return;}
 const data={fullName:document.getElementById('fullName').value.trim(),emailAddress:document.getElementById('emailAddress').value.trim(),gender:document.getElementById('gender').value.trim(),designation:document.getElementById('designation').value.trim(),organisation:document.getElementById('organisation').value.trim(),phoneNumber:document.getElementById('phoneNumber').value.trim(),nrcNumber:document.getElementById('nrcNumber').value.trim(),district:document.getElementById('district').value.trim(),mobileRegisteredName:document.getElementById('mobileRegisteredName').value.trim(),signature,livePhoto,photoVerified,eventSlug};
 if(!/^(09|07)[0-9]{8}$/.test(data.phoneNumber)){message.className='message error';message.textContent='Enter a valid Zambian mobile number.';return;}
 if(!/^[0-9]{6}\/[0-9]{2}\/[0-9]$/.test(data.nrcNumber)){message.className='message error';message.textContent='Use NRC format 123456/12/1.';return;}
 submitBtn.disabled=true; submitBtn.textContent='Getting location…';
 try{const gps=await getGpsLocation(); if(!gps || !Number.isFinite(gps.latitude) || !Number.isFinite(gps.longitude)){throw new Error('Registration cannot proceed without your GPS location. Allow location permission and ensure location services are enabled, then try again.');} Object.assign(data,gps); submitBtn.textContent='Submitting...'; const r=await fetch('/api/attendees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await r.json();if(!r.ok){if(r.status===410)closeRegistration(out.error);throw new Error(out.error);}window.location.href=`/registration-success?event=${encodeURIComponent(document.querySelector('#eventInfo strong')?.textContent||'CAMFED event')}&returnUrl=${encodeURIComponent(window.location.pathname)}`; return;}catch(err){message.className='message error';message.textContent=err.message;}finally{if(submitBtn.textContent!=='Registration Closed'){submitBtn.disabled=false;submitBtn.textContent='Submit Registration';}}
});
</script>
</body></html>
