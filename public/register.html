<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CAMFED Attendance Registration</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="purple-page">
<div class="container">
  <div class="card">
    <img src="/images/camfed-logo.png" class="logo" alt="CAMFED logo" onerror="this.style.display='none'">
    <div class="brand-slogan"><span>Learn, Thrive &amp; Lead for Change</span></div>
    <h1>CAMFED Attendance Registration</h1>
    <div id="eventInfo" class="event-box">Loading event information...</div>
    <form id="attendanceForm">
      <label>1. Full Name<input id="fullName" required></label>
      <label>2. Email Address<input id="emailAddress" type="email" autocomplete="email" required></label>
      <label>3. Gender<select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option></select></label>
      <label>4. Designation<input id="designation" required></label>
      <label>5. Organisation<input id="organisation" required></label>
      <label>6. Mobile Money Number<input id="phoneNumber" type="tel" inputmode="numeric" placeholder="0971234567" required></label>
      <label>7. NRC Number<input id="nrcNumber" placeholder="123456/12/1" required></label>
      <label>8. District<input id="district" required></label>
      <label>9. Mobile Registered Name<input id="mobileRegisteredName" required></label>
      <div class="photo-section">
        <label>9. Live Photo</label>
        <p>A clear live photo with your face visible is required.</p>
        <video id="photoVideo" autoplay playsinline muted hidden></video>
        <canvas id="photoCanvas" hidden></canvas>
        <img id="photoPreview" alt="Live photo preview" hidden>
        <div class="photo-actions">
          <button type="button" id="startCamera" class="secondary">Open Camera</button>
          <button type="button" id="capturePhoto" hidden>Capture Photo</button>
          <button type="button" id="retakePhoto" class="secondary" hidden>Retake Photo</button>
        </div>
        <p id="photoStatus" aria-live="polite">A live photo is required before registration.</p>
      </div>
      <div class="event-box"><strong></strong><p></p><p id="gpsStatus" aria-live="polite"></p></div>
      <div class="signature-section"><label>11. Signature</label><canvas id="signaturePad" width="900" height="300"></canvas><button type="button" id="clearSignature" class="secondary">Clear Signature</button></div>
      <button id="submitBtn" type="submit">Submit Registration</button>
      <p id="message" class="message"></p>
    </form>
  </div>
</div>
<script>
const form=document.getElementById('attendanceForm'), canvas=document.getElementById('signaturePad'), ctx=canvas.getContext('2d');
const message=document.getElementById('message'), submitBtn=document.getElementById('submitBtn');
let drawing=false, gpsLocation=null, livePhoto=null, photoValidationMessage=null, cameraStream=null, photoCaptureId=0, pathParts=location.pathname.split('/').filter(Boolean), eventSlug=pathParts[0]==='register' ? (pathParts[1] || '') : '';
const photoVideo=document.getElementById('photoVideo'), photoCanvas=document.getElementById('photoCanvas'), photoPreview=document.getElementById('photoPreview'), photoStatus=document.getElementById('photoStatus');
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}photoVideo.srcObject=null;}
document.getElementById('startCamera').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera access requires HTTPS or localhost and a supported browser.');stopCamera();cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});photoVideo.srcObject=cameraStream;photoVideo.hidden=false;photoPreview.hidden=true;document.getElementById('capturePhoto').hidden=false;document.getElementById('retakePhoto').hidden=true;photoStatus.textContent='Camera is ready. Position the camera and capture a photo.';}catch(err){photoStatus.textContent='Could not open camera: '+err.message;}};
function assessPhoto(canvas){const sample=document.createElement('canvas'), w=96, h=Math.max(1,Math.round(canvas.height*w/canvas.width));sample.width=w;sample.height=h;const sctx=sample.getContext('2d',{willReadFrequently:true});sctx.drawImage(canvas,0,0,w,h);const data=sctx.getImageData(0,0,w,h).data, gray=new Float32Array(w*h);let total=0,lit=0;for(let i=0,p=0;i<data.length;i+=4,p++){const y=.299*data[i]+.587*data[i+1]+.114*data[i+2];gray[p]=y;total+=y;if(y>=30)lit++;}const mean=total/gray.length;let lapTotal=0,lapSq=0,n=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,v=4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w];lapTotal+=v;lapSq+=v*v;n++;}const lapVariance=lapSq/n-(lapTotal/n)**2;return mean>=35&&lit/gray.length>=.2&&lapVariance>=20;}
const faceModelUrl='https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
let modernVisionPromise, legacyFaceScriptPromise;
function faceBoxIsClear(box,score,width,height){return score>=0.65&&box.width>=width*0.12&&box.height>=height*0.15&&box.width*box.height>=width*height*0.035;}
async function detectWithLegacyFaceSolution(image){
 const version='0.4.1646424915', base=`https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@${version}/`;
 if(!window.FaceDetection){legacyFaceScriptPromise ||= new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=base+'face_detection.js';script.crossOrigin='anonymous';script.onload=resolve;script.onerror=()=>reject(new Error('Could not load compatible face detector'));document.head.appendChild(script);});await legacyFaceScriptPromise;}
 const detector=new window.FaceDetection({locateFile:file=>base+file});detector.setOptions({model:'short',minDetectionConfidence:0.65});
 try{return await new Promise((resolve,reject)=>{detector.onResults(results=>resolve((results.detections||[]).some(d=>faceBoxIsClear(d.boundingBox,d.score?.[0]||0,1,1))));detector.send({image}).catch(reject);});}finally{detector.close();}
}
window.detectFaceInPhoto=async image=>{
 try{
  const loadModule=new Function('url','return import(url)');
  const vision=await (modernVisionPromise ||= loadModule('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs').then(async api=>({api,files:await api.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm')})).catch(err=>{modernVisionPromise=undefined;throw err;}));
  if(!window.mediaPipeFaceDetector)window.mediaPipeFaceDetector=await vision.api.FaceDetector.createFromOptions(vision.files,{baseOptions:{modelAssetPath:faceModelUrl,delegate:'CPU'},runningMode:'IMAGE',minDetectionConfidence:0.65});
  return window.mediaPipeFaceDetector.detect(image).detections.some(d=>faceBoxIsClear(d.boundingBox,d.categories?.[0]?.score||0,image.width,image.height));
 }catch(modernError){
  console.warn('Using compatible face detection fallback:',modernError);
  const results=await detectWithLegacyFaceSolution(image);
  return results;
 }
};
document.getElementById('capturePhoto').onclick=async()=>{if(!cameraStream||!photoVideo.videoWidth){photoStatus.textContent='Camera is not ready yet. Please wait and try again.';return;}const captureId=++photoCaptureId,maxW=900, scale=Math.min(1,maxW/photoVideo.videoWidth);photoCanvas.width=Math.round(photoVideo.videoWidth*scale);photoCanvas.height=Math.round(photoVideo.videoHeight*scale);photoCanvas.getContext('2d').drawImage(photoVideo,0,0,photoCanvas.width,photoCanvas.height);stopCamera();photoVideo.hidden=true;document.getElementById('capturePhoto').hidden=true;document.getElementById('retakePhoto').hidden=false;livePhoto=null;photoValidationMessage=null;photoPreview.hidden=true;if(!assessPhoto(photoCanvas)){photoValidationMessage='This photo is too dark, blurry, or unclear. Please retake it in good lighting and hold the camera steady.';photoStatus.textContent=photoValidationMessage;return;}photoStatus.textContent='Checking that your face is clearly visible…';try{const face=await window.detectFaceInPhoto(photoCanvas);if(captureId!==photoCaptureId)return;if(!face){photoValidationMessage='No clearly visible face was detected. Please retake the photo with your face centered, facing the camera, and closer to it.';photoStatus.textContent=photoValidationMessage;return;}livePhoto=photoCanvas.toDataURL('image/jpeg',0.82);photoPreview.src=livePhoto;photoPreview.hidden=false;photoStatus.textContent='Clear face detected and photo verified. You can retake it or continue.';}catch(err){if(captureId!==photoCaptureId)return;photoValidationMessage='Could not verify the face in this photo. Check your internet connection and retake the photo.';photoStatus.textContent=photoValidationMessage;console.error('Face detection failed:',err);}};
document.getElementById('retakePhoto').onclick=()=>{photoCaptureId++;livePhoto=null;photoValidationMessage=null;photoPreview.hidden=true;document.getElementById('retakePhoto').hidden=true;document.getElementById('startCamera').click();};
function getGpsLocation(){const status=document.getElementById('gpsStatus');if(!('geolocation' in navigator)){status.textContent='GPS is unavailable in this browser. Registration cannot proceed without location.';return Promise.resolve(null);}status.textContent='Requesting location permission…';return new Promise(resolve=>navigator.geolocation.getCurrentPosition(pos=>{gpsLocation={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,locationCapturedAt:new Date(pos.timestamp).toISOString()};status.textContent=`Location captured (accuracy about ${Math.round(pos.coords.accuracy)} metres).`;resolve(gpsLocation);},err=>{gpsLocation=null;status.textContent=err.code===1?'Location permission denied. Please allow location access to register.':'Could not get your location. Check GPS/location settings and try again.';resolve(null);},{enableHighAccuracy:true,timeout:10000,maximumAge:0}));}
function setupCanvas(){ const r=canvas.getBoundingClientRect(), d=window.devicePixelRatio||1; canvas.width=r.width*d; canvas.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth=2; ctx.lineCap='round'; }
setupCanvas(); window.addEventListener('resize',setupCanvas);
function point(e){const r=canvas.getBoundingClientRect(); const t=e.touches?.[0]||e; return {x:t.clientX-r.left,y:t.clientY-r.top};}
function start(e){drawing=true; const p=point(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault();}
function move(e){if(!drawing)return; const p=point(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault();}
function end(){drawing=false;}
canvas.addEventListener('pointerdown',start); canvas.addEventListener('pointermove',move); canvas.addEventListener('pointerup',end); canvas.addEventListener('pointerleave',end);
document.getElementById('clearSignature').onclick=()=>{ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);};
function signatureIsClear(){const {width,height}=canvas, pixels=ctx.getImageData(0,0,width,height).data;let minX=width,minY=height,maxX=-1,maxY=-1,visible=0;for(let y=0;y<height;y++)for(let x=0;x<width;x++){const i=(y*width+x)*4;if(pixels[i+3]>=160&&(pixels[i]+pixels[i+1]+pixels[i+2])/3<=150){visible++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}return visible>=Math.max(100,Math.ceil(width*height*0.0004))&&maxX-minX+1>=Math.ceil(width*0.09)&&maxY-minY+1>=Math.ceil(height*0.067);}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadEvent(){try{const url=eventSlug?`/api/event/${encodeURIComponent(eventSlug)}`:'/api/event'; const r=await fetch(url); const e=await r.json(); if(!r.ok)throw new Error(e.error); eventSlug=e.slug; document.getElementById('eventInfo').innerHTML=`<strong>${escapeHtml(e.name)}</strong><br>Date: ${escapeHtml(e.date)}<br>Venue: ${escapeHtml(e.venue)}`; if(e.expired){closeRegistration('Registration for this event has expired. Please contact the event administrator.');}}catch(err){document.getElementById('eventInfo').textContent=err.message;}}
function closeRegistration(reason){Array.from(form.elements).forEach(el=>el.disabled=true);submitBtn.disabled=true;submitBtn.textContent='Registration Closed';message.className='message error';message.textContent=reason;}
loadEvent();
form.addEventListener('submit',async e=>{e.preventDefault(); message.textContent=''; if(!form.reportValidity())return; const signature=canvas.toDataURL('image/png');
 if(!signatureIsClear()) {message.className='message error'; message.textContent='Your signature is too small, faint, or unclear. Please sign larger and darker in the box, then submit again.'; return;}
 if(!livePhoto){message.className='message error';message.textContent=photoValidationMessage||'Please capture and verify a live photo with your face clearly visible before submitting.';return;}
 const data={fullName:document.getElementById('fullName').value.trim(),emailAddress:document.getElementById('emailAddress').value.trim(),gender:document.getElementById('gender').value.trim(),designation:document.getElementById('designation').value.trim(),organisation:document.getElementById('organisation').value.trim(),phoneNumber:document.getElementById('phoneNumber').value.trim(),nrcNumber:document.getElementById('nrcNumber').value.trim(),district:document.getElementById('district').value.trim(),mobileRegisteredName:document.getElementById('mobileRegisteredName').value.trim(),signature,livePhoto,eventSlug};
 if(!/^(09|07)[0-9]{8}$/.test(data.phoneNumber)){message.className='message error';message.textContent='Enter a valid Zambian mobile number.';return;}
 if(!/^[0-9]{6}\/[0-9]{2}\/[0-9]$/.test(data.nrcNumber)){message.className='message error';message.textContent='Use NRC format 123456/12/1.';return;}
 submitBtn.disabled=true; submitBtn.textContent='Getting location…';
 try{const gps=await getGpsLocation(); if(!gps || !Number.isFinite(gps.latitude) || !Number.isFinite(gps.longitude)){throw new Error('Registration cannot proceed without your GPS location. Allow location permission and ensure location services are enabled, then try again.');} Object.assign(data,gps); submitBtn.textContent='Submitting...'; const r=await fetch('/api/attendees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await r.json();if(!r.ok){if(r.status===410)closeRegistration(out.error);throw new Error(out.error);}window.location.href=`/registration-success?event=${encodeURIComponent(document.querySelector('#eventInfo strong')?.textContent||'CAMFED event')}&returnUrl=${encodeURIComponent(window.location.pathname)}`; return;}catch(err){message.className='message error';message.textContent=err.message;}finally{if(submitBtn.textContent!=='Registration Closed'){submitBtn.disabled=false;submitBtn.textContent='Submit Registration';}}
});
</script>
</body></html>
