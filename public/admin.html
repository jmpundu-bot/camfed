<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMFED Admin</title><link rel="stylesheet" href="/style.css"></head>
<body class="purple-page admin-page"><div class="container admin-shell"><div class="card admin-card"><header class="dashboard-header"><img src="/images/camfed-logo.png" class="logo" alt="CAMFED logo"><div><h1>CAMFED Attendance System</h1><p>Administrator dashboard</p></div></header>
<section id="loginSection"><h2>Admin Login</h2><form id="loginForm"><label>Username<input id="username" required></label><label>Password<input id="password" type="password" required></label><button>Login</button><p id="loginMsg" class="message"></p></form></section>
<section id="dashboard" hidden><div class="admin-top"><h2>Admin Dashboard</h2><button id="logout" class="secondary">Logout</button></div><div class="province-layout"><main class="province-main"><div class="tablet-brand"><img src="/images/camfed-logo.png" alt="CAMFED logo"><span>Learn, Thrive &amp; Lead for Change</span></div><label for="provinceSelect">Select Province</label><select id="provinceSelect" required><option value="">Select Province</option></select><div id="provinceContent" hidden><h2 id="provinceTitle"></h2><form id="eventForm" class="event-form"><input id="eventName" placeholder="Event name" required><input id="eventDate" type="date" required><input id="eventVenue" placeholder="Venue" required><label class="expiry-hours-field">Registration link expires after (hours)<input id="eventExpiryHours" type="number" min="1" max="720" step="1" value="2" required></label><button type="submit">Create Event</button></form><p class="hint">Set a whole number from 1 to 720 hours (up to 30 days). You can change the expiry later for each event.</p><div id="events"></div></div></main></div></section>
</div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const $=id=>document.getElementById(id); const provinces=['Lusaka','Western','Central','Muchinga','Luapula','Northern','Eastern']; let selectedProvince=null; function provinceUrl(url){return url+(url.includes('?')?'&':'?')+'province='+encodeURIComponent(selectedProvince);} function renderProvinces(){const select=$('provinceSelect');select.innerHTML='<option value="">Select Province</option>'+provinces.map(p=>`<option value="${p}">${p}</option>`).join('');select.value=selectedProvince||'';} $('provinceSelect').onchange=()=>{selectedProvince=$('provinceSelect').value||null;$('provinceContent').hidden=!selectedProvince;if(selectedProvince){$('provinceTitle').textContent=selectedProvince+' Province';loadEvents();}}; async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function check(){try{await api('/api/admin/me');$('loginSection').hidden=true;$('dashboard').hidden=false;renderProvinces();loadEvents();}catch{}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});$('loginMsg').textContent='';check();}catch(x){$('loginMsg').className='message error';$('loginMsg').textContent=x.message;}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload();};
$('eventForm').onsubmit=async e=>{e.preventDefault();const submit=e.target.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;try{const result=await api('/api/admin/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('eventName').value,date:$('eventDate').value,venue:$('eventVenue').value,province:selectedProvince,registrationHours:Number($('eventExpiryHours').value)})});e.target.reset();alert(result.message||'Event created.');await loadEvents();}catch(x){alert(x.message);}finally{if(submit)submit.disabled=false;}};
async function loadEvents(){if($('dashboard').hidden||!selectedProvince)return;const events=await api(provinceUrl('/api/admin/events'));$('events').innerHTML=events.length?'':'<p>No events yet.</p>';events.forEach(ev=>{const d=document.createElement('div');d.className='event-card';const expiryMs=Date.parse(ev.registration_expires_at||new Date(Date.parse(ev.created_at)+2*60*60*1000));const expired=Date.now()>=expiryMs;const expiryText=Number.isFinite(expiryMs)?new Date(expiryMs).toLocaleString():'Unknown';const validity=Number(ev.registration_hours)||2;const reportStatus=expired?`<p class="expiry-notice"><strong>Registration expired.</strong> Change the expiry hours below to reopen this link if needed. Download the attendance PDF and CSV for this event.</p>`:'';d.innerHTML=`<h3>${esc(ev.name)}</h3><p>${esc(ev.date)} · ${esc(ev.venue)}</p><p><strong>${ev.attendee_count}</strong> attendees</p><p><strong>Link validity:</strong> ${validity} hour(s) · <strong>Expires:</strong> ${esc(expiryText)} · <strong>Status:</strong> ${expired?'Expired':'Open'}</p><p>Registration link: <a href="/register/${encodeURIComponent(ev.slug)}" target="_blank" rel="noopener"><code>${esc(location.origin)}/register/${esc(ev.slug)}</code></a> <button type="button" onclick="copyLink('${esc(ev.slug)}')">Copy Link</button></p><div class="expiry-editor"><label>Set new validity (hours)<input id="expiry-hours-${ev.id}" type="number" min="1" max="720" step="1" value="${validity}" required></label><button type="button" onclick="setExpiry(${ev.id})">Save Expiry / Restart Countdown</button></div><div class="event-qr"><img loading="lazy" width="160" height="160" alt="Registration QR code for ${esc(ev.name)}" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(location.origin + '/register/' + ev.slug)}"><p>Scan to register for this event</p></div><button type="button" onclick="downloadQrPdf('${esc(ev.name).replace(/'/g, "&#39;")}','${esc(ev.date)}','${esc(ev.venue).replace(/'/g, "&#39;")}','${esc(ev.slug)}')">Download QR Code (PDF)</button> <button type="button" id="view-btn-${ev.id}" onclick="view(${ev.id})">View Attendees</button> <button onclick="pdf(${ev.id})">Download PDF</button> <button onclick="csv(${ev.id})">Download CSV</button> <button class="danger" onclick="deleteEvent(${ev.id},'${esc(ev.name).replace(/'/g, '&#39;')}',${ev.attendee_count})">Delete Event</button>${reportStatus}<div id="list-${ev.id}" hidden></div>`;$('events').appendChild(d);});}
async function setExpiry(eventId){const field=$('expiry-hours-'+eventId);const hours=Number(field.value);if(!Number.isInteger(hours)||hours<1||hours>720){alert('Enter a whole number from 1 to 720 hours.');return;}if(!confirm(`Set this registration link to expire ${hours} hour(s) from now? This restarts the expiry countdown.`))return;try{const result=await api(provinceUrl('/api/admin/events/'+eventId+'/expiry'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({registrationHours:hours})});alert(result.message);await loadEvents();}catch(e){alert(e.message);}}

async function copyLink(slug){const link=location.origin+'/register/'+slug;try{await navigator.clipboard.writeText(link);alert('Registration link copied.');}catch{prompt('Copy this registration link:',link);}}
async function downloadQrPdf(name,date,venue,slug){
  const link=location.origin+'/register/'+slug;
  const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=600x600&format=png&data='+encodeURIComponent(link);
  try {
    const response=await fetch(qrUrl); if(!response.ok) throw Error('Could not generate QR code. Check your internet connection and try again.');
    const blob=await response.blob(); const reader=new FileReader();
    reader.onload=()=>{
      if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF generator is unavailable. Check your internet connection and try again.');return;}
      const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
      doc.setFontSize(20); doc.text('CAMFED Event Registration',105,22,{align:'center'});
      doc.setFontSize(14); doc.text(String(name),105,35,{align:'center',maxWidth:175});
      doc.setFontSize(11); doc.text('Date: '+String(date),105,48,{align:'center'}); doc.text('Venue: '+String(venue),105,56,{align:'center',maxWidth:175});
      doc.addImage(reader.result,'PNG',55,68,100,100);
      doc.setFontSize(11); doc.text('Scan this QR code to register for the event',105,178,{align:'center'});
      doc.setFontSize(9); doc.text(link,105,188,{align:'center',maxWidth:180});
      const safeName=String(name).replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'event';
      doc.save('CAMFED_'+safeName+'_Registration_QR.pdf');
    }; reader.readAsDataURL(blob);
  } catch(e){alert(e.message||'Unable to download QR PDF. Please try again.');}
}
const attendeeViewTimers = new Map();
const ATTENDEE_VIEW_MS = 3 * 60 * 1000;
function closeAttendeeView(id, message=''){const box=$('list-'+id);const btn=$('view-btn-'+id);const timer=attendeeViewTimers.get(id);if(timer){clearInterval(timer.interval);clearTimeout(timer.timeout);attendeeViewTimers.delete(id);}if(box){box.hidden=true;box.innerHTML='';}if(btn)btn.textContent='View Attendees';if(message)alert(message);}
async function view(id){const box=$('list-'+id);if(!box.hidden){closeAttendeeView(id);return;}const btn=$('view-btn-'+id);btn.disabled=true;try{const x=await api(provinceUrl('/api/admin/events/'+id+'/attendees'));box.innerHTML=x.attendees.length?'<div class="table-wrap"><table><tr><th>No.</th><th>Name</th><th>Gender</th><th>Designation</th><th>Organisation</th><th>Phone</th><th>NRC</th><th>District</th><th>GPS Location</th><th>Action</th></tr>'+x.attendees.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.full_name)}</td><td>${esc(a.gender)}</td><td>${esc(a.designation)}</td><td>${esc(a.organisation)}</td><td>${esc(a.phone_number)}</td><td>${esc(a.nrc_number)}</td><td>${esc(a.district)}</td><td>${a.latitude!=null&&a.longitude!=null?`<a href="https://www.google.com/maps?q=${a.latitude},${a.longitude}" target="_blank" rel="noopener">View map</a><br><small>${Number(a.latitude).toFixed(6)}, ${Number(a.longitude).toFixed(6)}${a.gps_accuracy_m!=null?` (±${Math.round(a.gps_accuracy_m)} m)`:''}</small>`:'Not captured'}</td><td><button class=\"danger\" onclick=\"deleteAttendee(${a.id},${id},'${esc(a.full_name).replace(/'/g, '&#39;')}')\">Delete</button></td></tr>`).join('')+'</table></div>':'<p>No attendees.</p>';box.hidden=false;btn.textContent='Close Attendees';const timeout=setTimeout(()=>closeAttendeeView(id),ATTENDEE_VIEW_MS);attendeeViewTimers.set(id,{timeout});}catch(e){alert(e.message);}finally{btn.disabled=false;}}
async function deleteEvent(eventId,eventName,attendeeCount){
  const warning = `Delete the event "${eventName}" and all ${attendeeCount} attendee record(s)? This also removes saved signatures and cannot be undone.`;
  if(!confirm(warning)) return;
  try {
    const result = await api(provinceUrl('/api/admin/events/'+eventId),{method:'DELETE'});
    alert(`Event deleted. ${result.deletedAttendees} attendee record(s) were also removed.`);
    await loadEvents();
  } catch(e) { alert(e.message); }
}
async function deleteAttendee(attendeeId,eventId,fullName){if(!confirm(`Delete the record for ${fullName}? This action cannot be undone.`))return;try{await api(provinceUrl('/api/admin/attendees/'+attendeeId),{method:'DELETE'});await view(eventId);await loadEvents();}catch(e){alert(e.message);}}
setInterval(()=>{if(!$('dashboard').hidden)loadEvents().catch(()=>{});},30000);
function pdf(id){window.location.href=provinceUrl('/api/admin/events/'+id+'/pdf');} function csv(id){window.location.href=provinceUrl('/api/admin/events/'+id+'/csv');} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));} check();
</script></body></html>
